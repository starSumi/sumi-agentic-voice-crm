[workspace]
members = ["crates/runtime-supervisor"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/starSumi/sumi-agentic-voice-crm"

[workspace.dependencies]
libc = "=0.2.186"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
