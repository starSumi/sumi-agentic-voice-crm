openapi: 3.1.0
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base
info:
  title: Sumi Agentic Voice CRM API
  version: 1.0.0
  description: >-
    Contract-first text/audio CRM interaction API. Provider implementations are
    replaceable adapters. Every mutation is bearer-authenticated, tenant scoped,
    and idempotent.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
paths:
  /v1/ask:
    post:
      operationId: ask
      summary: Ask the agent using text or audio
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AskRequest' }
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MultipartAudioAskRequest'
            encoding:
              audio:
                contentType: audio/wav, audio/x-wav, audio/mpeg, audio/mp4, audio/webm
              metadata:
                contentType: application/json
      responses:
        '200': { description: Completed, content: { application/json: { schema: { $ref: '#/components/schemas/AskResponse' } } } }
        '202': { description: Review required, content: { application/json: { schema: { $ref: '#/components/schemas/ReviewResponse' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
        '504': { $ref: '#/components/responses/Error' }
  /v1/tts/synthesize:
    post:
      operationId: synthesize
      summary: Synthesize a text response into an audio asset
      security:
        - bearerAuth: []
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TtsRequest' } } }
      responses:
        '201': { description: Audio asset, content: { application/json: { schema: { $ref: '#/components/schemas/TtsSynthesizeResponse' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
        '504': { $ref: '#/components/responses/Error' }
  /v1/reviews/{review_id}/decision:
    post:
      operationId: decideReview
      summary: Approve or reject a low-confidence agent decision
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - name: review_id
          in: path
          required: true
          schema: { type: string, pattern: '^(rev_[A-Za-z0-9_-]{4,64}|[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89ab][0-9a-fA-F]{3}-[0-9a-fA-F]{12})$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision]
              properties:
                decision: { type: string, enum: [approve, reject] }
                correction: { type: object, additionalProperties: true }
      responses:
        '200': { description: Review decision recorded, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT or opaque token
      description: Tenant-scoped credential. Production supports verified OIDC JWTs or a private single-tenant static bearer token bound to a configured tenant and subject.
  parameters:
    TenantId:
      name: X-Tenant-Id
      in: header
      required: false
      description: Tenant boundary selected by an OIDC actor. Optional in static mode because the server binds the credential to one configured tenant; a conflicting value is rejected.
      schema: { $ref: '#/components/schemas/TenantId' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Stable mutation key. Reuse with a different request fingerprint returns 409.
      schema: { $ref: '#/components/schemas/IdempotencyKey' }
  responses:
    Error:
      description: Stable Sumi error envelope. The request_id can be used to correlate audit and event records.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    TenantId:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
    IdempotencyKey:
      type: string
      minLength: 8
      maxLength: 128
      pattern: '^[A-Za-z0-9._:-]{8,128}$'
    Locale:
      type: string
      enum: [zh-CN, en-US, hi-IN, te-IN]
      default: zh-CN
    RequestId:
      type: string
      pattern: '^req_[0-9a-f]{24}$'
    TextInput:
      type: object
      additionalProperties: false
      required: [type, text]
      properties:
        type: { const: text }
        text: { type: string, minLength: 1, maxLength: 10000 }
    AudioInput:
      type: object
      additionalProperties: false
      required: [type]
      description: >-
        Base64 audio is the normal JSON representation. The nullable deprecated
        alias is retained so an explicitly empty source reaches the documented
        422 NO_AUDIO_SOURCE boundary instead of becoming a protocol 400.
      properties:
        type: { const: audio }
        data_base64:
          type: [string, 'null']
          minLength: 1
          contentEncoding: base64
          pattern: '^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$'
        content_type:
          type: string
          enum: [audio/wav, audio/x-wav, audio/mpeg, audio/mp4, audio/webm]
          default: audio/wav
        audio: { type: 'null', description: Deprecated compatibility alias for an empty audio source. }
    TextAskRequest:
      type: object
      additionalProperties: false
      required: [input, output_mode]
      properties:
        input: { $ref: '#/components/schemas/TextInput' }
        output_mode: { type: string, enum: [text, audio, both] }
        locale: { $ref: '#/components/schemas/Locale' }
        conversation_id: { type: string, maxLength: 128 }
    AudioAskRequest:
      type: object
      additionalProperties: false
      required: [input, output_mode]
      properties:
        input: { $ref: '#/components/schemas/AudioInput' }
        output_mode: { type: string, enum: [text, audio, both] }
        locale: { $ref: '#/components/schemas/Locale' }
        conversation_id: { type: string, maxLength: 128 }
    AskRequest:
      description: JSON request union. The nested const input.type values make the variants mutually exclusive.
      oneOf:
        - { $ref: '#/components/schemas/TextAskRequest' }
        - { $ref: '#/components/schemas/AudioAskRequest' }
    MultipartAudioAskRequest:
      type: object
      additionalProperties: false
      required: [audio, metadata]
      properties:
        audio: { type: string, format: binary }
        metadata:
          type: string
          contentMediaType: application/json
          description: JSON-encoded object containing output_mode, locale and optional conversation_id.
    Understanding:
      type: object
      additionalProperties: false
      required: [intent, confidence, entities, missing, needs_confirmation, schema_version]
      properties:
        intent: { type: string }
        confidence: { type: number, minimum: 0, maximum: 1 }
        entities: { type: object, additionalProperties: true }
        missing: { type: array, items: { type: string } }
        needs_confirmation: { type: boolean }
        schema_version: { type: string }
        source:
          type: object
          additionalProperties: false
          properties:
            transcript_hash: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
            language: { type: string, minLength: 1, maxLength: 16 }
            model: { type: string, minLength: 1, maxLength: 128 }
    AskResponse:
      type: object
      additionalProperties: false
      required: [request_id, status, input, understanding, answer]
      properties:
        request_id: { $ref: '#/components/schemas/RequestId' }
        status: { const: completed }
        input: { type: object, additionalProperties: true }
        understanding: { $ref: '#/components/schemas/Understanding' }
        crm: { type: object, additionalProperties: true }
        answer: { type: object, required: [text], properties: { text: { type: string }, language: { type: string } } }
        audio: { $ref: '#/components/schemas/TtsAsset' }
    ReviewResponse:
      type: object
      additionalProperties: false
      required: [request_id, status, input, understanding, answer, review_task]
      properties:
        request_id: { $ref: '#/components/schemas/RequestId' }
        status: { const: needs_review }
        input: { type: object, additionalProperties: true }
        understanding: { $ref: '#/components/schemas/Understanding' }
        answer: { type: object, additionalProperties: false, required: [text], properties: { text: { type: string }, language: { $ref: '#/components/schemas/Locale' } } }
        review_task: { type: object, required: [id], properties: { id: { type: string }, expires_at: { type: string, format: date-time } } }
    TtsRequest:
      type: object
      additionalProperties: false
      required: [text, language, format]
      properties:
        text: { type: string, minLength: 1, maxLength: 5000 }
        language: { $ref: '#/components/schemas/Locale' }
        voice: { type: string, minLength: 1, maxLength: 128 }
        format: { type: string, enum: [mp3, wav, ogg] }
    TtsAsset:
      type: object
      additionalProperties: false
      required: [asset_id, url, mime_type, status]
      properties:
        asset_id: { type: string }
        url: { type: string, format: uri-reference }
        mime_type: { type: string }
        duration_ms: { type: integer, minimum: 0 }
        expires_at: { type: string, format: date-time }
        status: { type: string, enum: [ready, failed, pending] }
        voice: { type: string }
        provider: { type: string }
        model: { type: string }
    TtsSynthesizeResponse:
      type: object
      additionalProperties: false
      required: [request_id, asset, idempotency_replay]
      properties:
        request_id: { $ref: '#/components/schemas/RequestId' }
        asset: { $ref: '#/components/schemas/TtsAsset' }
        idempotency_replay: { type: boolean }
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [request_id, status, error]
      properties:
        request_id: { $ref: '#/components/schemas/RequestId' }
        status: { const: failed }
        error:
          type: object
          additionalProperties: false
          required: [code, message, retryable, details]
          properties:
            code:
              type: string
              enum: [INVALID_REQUEST, UNAUTHORIZED, FORBIDDEN, UNSUPPORTED_MEDIA, NO_AUDIO_SOURCE, EMPTY_TRANSCRIPT, INTENT_LOW_CONFIDENCE, CRM_CONFLICT, ASR_TIMEOUT, IDEMPOTENCY_CONFLICT, UPSTREAM_UNAVAILABLE, PROVIDER_REJECTED, RATE_LIMITED]
            message: { type: string, minLength: 1, maxLength: 1000 }
            retryable: { type: boolean }
            details: { type: object, additionalProperties: true }
