name: operations-agent

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: operations-agent-${{ github.repository }}
  cancel-in-progress: false

jobs:
  observe:
    if: >-
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main') ||
      (github.event_name != 'workflow_run' &&
      github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      conclusion: ${{ steps.result.outputs.conclusion }}
      reason: ${{ steps.result.outputs.reason }}
      head_sha: ${{ steps.result.outputs.head_sha }}
      observed_run_id: ${{ steps.result.outputs.observed_run_id }}
      run_url: ${{ steps.result.outputs.run_url }}
    steps:
      - id: checkout
        name: Check out trusted main source
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - id: setup
        name: Set up Node.js
        if: steps.checkout.outcome == 'success'
        continue-on-error: true
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - id: install
        name: Install dependencies for scheduled verification
        if: >-
          github.event_name != 'workflow_run' &&
          steps.setup.outcome == 'success'
        continue-on-error: true
        run: npm ci

      - id: verify
        name: Verify the default branch
        if: >-
          github.event_name != 'workflow_run' &&
          steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run verify

      - id: health
        name: Check maintainer and handoff freshness
        if: steps.setup.outcome == 'success'
        continue-on-error: true
        run: npm run agent:health

      - id: result
        name: Resolve the operations result
        if: always()
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          UPSTREAM_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          HEALTH_OUTCOME: ${{ steps.health.outcome }}
          CURRENT_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            base_result="$UPSTREAM_CONCLUSION"
            head_sha="$UPSTREAM_HEAD_SHA"
            observed_run_id="$UPSTREAM_RUN_ID"
          else
            base_result="$VERIFY_OUTCOME"
            head_sha="$CURRENT_SHA"
            observed_run_id=""
          fi

          conclusion="success"
          if [[ "$CHECKOUT_OUTCOME" != "success" || "$SETUP_OUTCOME" != "success" ]]; then
            conclusion="failure"
          elif [[ "$EVENT_NAME" != "workflow_run" && ("$INSTALL_OUTCOME" != "success" || "$base_result" != "success") ]]; then
            conclusion="failure"
          elif [[ "$EVENT_NAME" == "workflow_run" && "$base_result" != "success" ]]; then
            conclusion="failure"
          elif [[ "$HEALTH_OUTCOME" != "success" ]]; then
            conclusion="failure"
          fi

          reason="upstream=${base_result}; checkout=${CHECKOUT_OUTCOME}; setup=${SETUP_OUTCOME}; install=${INSTALL_OUTCOME}; verify=${VERIFY_OUTCOME}; health=${HEALTH_OUTCOME}"
          run_url="https://github.com/${REPOSITORY}/actions/runs/${RUN_ID}"
          echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "observed_run_id=$observed_run_id" >> "$GITHUB_OUTPUT"
          echo "run_url=$run_url" >> "$GITHUB_OUTPUT"

      - id: snapshot
        name: Write the operations snapshot
        if: always() && steps.checkout.outcome == 'success'
        continue-on-error: true
        env:
          SUMI_OPS_CONCLUSION: ${{ steps.result.outputs.conclusion }}
          SUMI_OPS_REASON: ${{ steps.result.outputs.reason }}
          SUMI_OPS_RUN_URL: ${{ steps.result.outputs.run_url }}
          SUMI_OPS_BRANCH: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
        run: node scripts/agent-ops.mjs snapshot --session-id "github-actions-${GITHUB_RUN_ID}" --output artifacts/agent-ops/operations-snapshot.json

      - name: Upload the operations snapshot
        if: always() && steps.snapshot.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: operations-snapshot-${{ github.run_id }}
          path: artifacts/agent-ops/operations-snapshot.json
          if-no-files-found: error
          retention-days: 30

      - name: Preserve the failed observation result
        if: always() && steps.result.outputs.conclusion != 'success'
        run: exit 1

  authorize-reconcile:
    if: >-
      always() &&
      ((github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main') ||
      (github.event_name != 'workflow_run' &&
      github.ref == 'refs/heads/main'))
    needs: observe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      current: ${{ steps.freshness.outputs.current }}
    steps:
      - id: freshness
        name: Reject superseded observations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ needs.observe.outputs.head_sha }}
          OBSERVED_RUN_ID: ${{ needs.observe.outputs.observed_run_id }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/${REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          current=false

          if [[ -z "${HEAD_SHA:-}" || "$HEAD_SHA" != "$main_sha" ]]; then
            echo "Observation commit ${HEAD_SHA:-unknown} is not current main $main_sha; skipping reconciliation."
          elif [[ "$EVENT_NAME" == "workflow_run" ]]; then
            latest_run_id="$(gh api "repos/${REPOSITORY}/actions/workflows/ci.yml/runs?branch=main&event=push&per_page=100" --jq '.workflow_runs[0].id')"
            if [[ -n "${OBSERVED_RUN_ID:-}" && "$OBSERVED_RUN_ID" == "$latest_run_id" ]]; then
              current=true
            else
              echo "Observation run ${OBSERVED_RUN_ID:-unknown} is superseded by CI run ${latest_run_id:-unknown}; skipping reconciliation."
            fi
          else
            current=true
          fi

          echo "current=$current" >> "$GITHUB_OUTPUT"

  reconcile:
    if: >-
      always() &&
      needs.authorize-reconcile.result == 'success' &&
      needs.authorize-reconcile.outputs.current == 'true'
    needs: [observe, authorize-reconcile]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Reconcile the main health issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CONCLUSION: ${{ needs.observe.outputs.conclusion }}
          REASON: ${{ needs.observe.outputs.reason }}
          HEAD_SHA: ${{ needs.observe.outputs.head_sha }}
          RUN_URL: ${{ needs.observe.outputs.run_url }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          title='[CI Operations] main requires attention'
          conclusion="${CONCLUSION:-failure}"
          reason="${REASON:-observation job did not produce a result}"
          head_sha="${HEAD_SHA:-unknown}"
          run_url="${RUN_URL:-https://github.com/${REPOSITORY}/actions}"
          observed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          details=$(printf '%s\n' \
            "- Result: \`$conclusion\`" \
            "- Reason: $reason" \
            "- Event: \`$EVENT_NAME\`" \
            "- Commit: \`$head_sha\`" \
            "- Run: $run_url" \
            "- Observed: \`$observed_at\`")
          mapfile -t issue_numbers < <(
            gh api --paginate "repos/${REPOSITORY}/issues?state=open&per_page=100" \
              --jq ".[] | select(.pull_request == null and .title == \"$title\") | .number"
          )

          if [[ "$conclusion" == "success" ]]; then
            for number in "${issue_numbers[@]}"; do
              jq -n --arg body "Main health recovered.\n\n$details" '{body: $body}' |
                gh api --method POST "repos/${REPOSITORY}/issues/${number}/comments" --input - >/dev/null
              jq -n '{state: "closed", state_reason: "completed"}' |
                gh api --method PATCH "repos/${REPOSITORY}/issues/${number}" --input - >/dev/null
            done
            exit 0
          fi

          body=$(printf '%s\n\n%s\n\n%s' \
            'The trusted main-branch operations workflow requires human attention.' \
            "$details" \
            'The CI Operations Agent does not edit source, advance checkpoints, or publish a release. Review the run, assign an owner, and preserve rollback evidence.')
          if (( ${#issue_numbers[@]} > 0 )); then
            jq -n --arg body "$body" '{body: $body}' |
              gh api --method POST "repos/${REPOSITORY}/issues/${issue_numbers[0]}/comments" --input - >/dev/null
          else
            jq -n --arg title "$title" --arg body "$body" '{title: $title, body: $body}' |
              gh api --method POST "repos/${REPOSITORY}/issues" --input - >/dev/null
          fi
