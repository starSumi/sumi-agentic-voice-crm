name: release-candidate

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Full reviewed main commit to package
        required: true
        type: string
      release_version:
        description: Exact package version approved for the candidate
        required: true
        type: string

concurrency:
  group: release-candidate-${{ github.repository }}
  cancel-in-progress: false

jobs:
  acceptance:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the reviewed main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_commit }}
          fetch-depth: 0
      - name: Verify the reviewed commit and package version
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test "$(git rev-parse origin/main)" = "$EXPECTED_COMMIT"
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const packageMetadata = JSON.parse(readFileSync("package.json", "utf8"));
          if (packageMetadata.version !== process.env.RELEASE_VERSION) {
            throw new Error("release version does not match package.json");
          }
          NODE
      - name: Set up the package manager pinned in package.json
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Set up the pinned Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: echo "$(pg_config --bindir)" >> "$GITHUB_PATH"
      - run: pnpm run verify:ci
      - name: Audit the locked Rust dependency graph
        uses: rustsec/audit-check@858dc40f52ca2b8570b7a997c1c4e35c6fc9a432
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run bounded load and dependency-fault drills
        run: |
          pnpm run drill:load
          pnpm run drill:fault
      - name: Build and smoke-test the production container
        run: pnpm run smoke:docker
      - run: pnpm run audit:deps
      - run: pnpm run sbom
      - run: pnpm run sbom:check
      - name: Create deterministic release payload and checksum
        run: |
          set -euo pipefail
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -cf - dist | gzip -n > artifacts/release/sumi-agentic-voice-crm-${{ inputs.release_version }}.tar.gz
          cd artifacts/release
          sha256sum "sumi-agentic-voice-crm-${{ inputs.release_version }}.tar.gz" > SHA256SUMS
      - name: Upload the unprivileged candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-${{ inputs.release_version }}-${{ inputs.expected_commit }}
          path: artifacts/release/
          if-no-files-found: error
          retention-days: 30

  attest:
    needs: acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-release
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download the accepted candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-${{ inputs.release_version }}-${{ inputs.expected_commit }}
          path: artifacts/release
      - id: provenance
        name: Generate build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/release/sumi-agentic-voice-crm-${{ inputs.release_version }}.tar.gz
      - id: sbom
        name: Attest the SPDX SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/release/sumi-agentic-voice-crm-${{ inputs.release_version }}.tar.gz
          sbom-path: artifacts/release/sbom.spdx.json
      - name: Preserve local attestation bundles
        env:
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom.outputs.bundle-path }}
        run: |
          cp "$PROVENANCE_BUNDLE" artifacts/release/provenance.sigstore.json
          cp "$SBOM_BUNDLE" artifacts/release/sbom.sigstore.json
      - name: Upload the attested candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: attested-release-candidate-${{ inputs.release_version }}-${{ inputs.expected_commit }}
          path: artifacts/release/
          if-no-files-found: error
          retention-days: 90
