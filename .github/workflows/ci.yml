name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up the package manager pinned in package.json
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: echo "$(pg_config --bindir)" >> "$GITHUB_PATH"
      - run: pnpm run verify
      - name: Run bounded load and dependency-fault drills
        run: |
          pnpm run drill:load
          pnpm run drill:fault
      - name: Build and smoke-test the production container
        run: pnpm run smoke:docker
      - name: Generate the runtime SPDX SBOM
        run: pnpm run sbom
      - name: Validate the SPDX SBOM
        run: node -e "const s=require('./artifacts/release/sbom.spdx.json');if(s.spdxVersion!=='SPDX-2.3')process.exit(1)"
      - name: Upload reviewed build evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-evidence-${{ github.sha }}
          path: |
            dist/BUILD-MANIFEST.json
            artifacts/release/sbom.spdx.json
            artifacts/release/load-drill.json
            artifacts/release/fault-drill.json
          if-no-files-found: error
          retention-days: 30
      - run: pnpm run audit:deps
