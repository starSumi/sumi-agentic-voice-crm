name: Bug report
description: Report a reproducible defect in the runtime, contracts, documentation, or MCP projection.
title: "bug: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, customer data, audio, or raw transcripts.
  - type: textarea
    id: current
    attributes:
      label: Current behavior
      description: Include the smallest reproducible input and the observed result.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Reproduction evidence
      description: Commands, exit codes, Node/npm versions, request IDs, and redacted responses.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - Runtime or provider
        - OpenAPI or event contract
        - Data or tenant boundary
        - Documentation Web site
        - MCP projection
        - Build, CI, or release
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Safety, data, and rollback impact
      description: State whether CRM data changed and how the operation was stopped or rolled back.
    validations:
      required: true
